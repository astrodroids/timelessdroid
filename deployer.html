<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeless Droid Deployer</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0d1117; color: #c9d1d9; padding: 16px; max-width: 600px; margin: auto; }
    h2 { color: #58a6ff; margin-top: 0; }
    label { display: block; margin-top: 12px; font-weight: bold; font-size: 14px; }
    input, textarea, button { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 10px; border-radius: 6px; border: 1px solid #30363d; background: #161b22; color: #c9d1d9; font-size: 14px; }
    textarea { height: 220px; font-family: monospace; }
    button { background: #238636; color: #fff; font-weight: bold; border: none; cursor: pointer; margin-top: 16px; padding: 12px; font-size: 16px; }
    button.secondary { background: #21262d; border: 1px solid #30363d; margin-top: 8px; }
    #status { margin-top: 14px; padding: 10px; border-radius: 6px; display: none; font-size: 14px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>🚀 Timeless Droid Deployer</h2>
  
  <label>GitHub Token (Saved locally on your Pixel)</label>
  <input type="password" id="token" placeholder="Paste github_pat_... here">
  
  <label>File Path in astrodroids/timelessdroid</label>
  <input type="text" id="filepath" value="index.html">
  
  <button class="secondary" onclick="fetchCurrentFile()">📥 Load Current File from GitHub</button>

  <label>File Content (HTML / CSS / JS)</label>
  <textarea id="content" placeholder="Paste updated code from Gemini here..."></textarea>

  <label>Commit Message</label>
  <input type="text" id="message" value="Update via Timeless Droid Deployer">

  <button onclick="pushToGitHub()">⚡ Push to Live Site</button>
  <div id="status"></div>

  <script>
    const REPO = "astrodroids/timelessdroid";
    const tokenInput = document.getElementById("token");
    tokenInput.value = localStorage.getItem("td_gh_token") || "";
    tokenInput.addEventListener("input", () => localStorage.setItem("td_gh_token", tokenInput.value.trim()));

    function showStatus(msg, isError = false) {
      const el = document.getElementById("status");
      el.style.display = "block";
      el.style.background = isError ? "#3d1c1e" : "#122d1f";
      el.style.border = isError ? "1px solid #f85149" : "1px solid #2ea043";
      el.textContent = msg;
    }

    async function fetchCurrentFile() {
      const token = tokenInput.value.trim();
      const path = document.getElementById("filepath").value.trim();
      if (!token) return showStatus("Please paste your GitHub token first.", true);
      showStatus("Fetching " + path + "...");
      try {
        const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
          headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github+json" }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${(await res.json()).message}`);
        const data = await res.json();
        const bytes = Uint8Array.from(atob(data.content.replace(/\n/g, "")), c => c.charCodeAt(0));
        document.getElementById("content").value = new TextDecoder().decode(bytes);
        showStatus("Loaded " + path + " successfully!");
      } catch (err) {
        showStatus("Error: " + err.message, true);
      }
    }

    async function pushToGitHub() {
      const token = tokenInput.value.trim();
      const path = document.getElementById("filepath").value.trim();
      const content = document.getElementById("content").value;
      const message = document.getElementById("message").value.trim() || "Update " + path;
      if (!token || !path || !content) return showStatus("Token, file path, and content are required.", true);

      showStatus("Pushing " + path + " to GitHub...");
      try {
        let sha = undefined;
        const getRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
          headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github+json" }
        });
        if (getRes.ok) {
          const getData = await getRes.json();
          sha = getData.sha;
        }

        const bytes = new TextEncoder().encode(content);
        let binary = "";
        bytes.forEach(b => binary += String.fromCharCode(b));
        const base64Content = btoa(binary);

        const putRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
          method: "PUT",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Accept": "application/vnd.github+json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message, content: base64Content, ...(sha ? { sha } : {}) })
        });
        if (!putRes.ok) throw new Error(`HTTP ${putRes.status}: ${(await putRes.json()).message}`);
        showStatus("✅ Successfully pushed " + path + " to live site!");
      } catch (err) {
        showStatus("❌ Push failed: " + err.message, true);
      }
    }
  </script>
</body>
</html>
